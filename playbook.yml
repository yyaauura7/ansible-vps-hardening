---
- name: VPS Initial Setup and Security Hardening (Ubuntu 24.04)
  hosts: vps
  become: true

  vars:
    devops_user: devops
    ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBkuDmQKM/IwTx8q7x8dSr3o4RfCctT3kN6+adyLn1Ml yyaauura2005@mail.ru"

  tasks:
    # --- БЛОК 1: Пользователь и SSH-ключ ---
    - name: Ensure devops user exists with sudo privileges
      ansible.builtin.user:
        name: "{{ devops_user }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true

    - name: Add authorized SSH key for devops user
      ansible.posix.authorized_key:
        user: "{{ devops_user }}"
        state: present
        key: "{{ ssh_public_key }}"

    # --- БЛОК 2: SSH Hardening ---
    - name: Disable root login via SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Disable password authentication via SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    # --- БЛОК 3: Настройка файрвола UFW ---
    - name: Ensure UFW is installed
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Allow SSH, HTTP, and HTTPS in UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Enable UFW with default deny incoming policy
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # --- БЛОК 4: Установка и настройка Fail2Ban ---
    - name: Ensure Fail2Ban is installed
      ansible.builtin.apt:
        name: fail2ban
        state: present

    - name: Configure Fail2Ban sshd jail with systemd backend
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'
        content: |
          [sshd]
          enabled = true
          port = ssh
          backend = systemd
          maxretry = 5
          bantime = 3600
      notify: Restart Fail2Ban

    - name: Ensure Fail2Ban service is enabled and running
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # --- БЛОК 5: Установка и запуск Nginx ---
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Ensure Nginx service is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
